name: Sync upstream main

on:
  repository_dispatch:
    types: [sync-upstream-main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: gh repo sync "${{ github.repository }}" --branch main
